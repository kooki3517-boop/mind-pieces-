:root{--ink:#291c31;--deep:#3b2947;--purple:#704e7d;--mauve:#a7799f;--pink:#d6a7b8;--cream:#f0d7c5}*{box-sizing:border-box}body{margin:0;background:#1d1425;color:var(--ink);font-family:monospace;image-rendering:pixelated}.app{max-width:430px;min-height:100dvh;margin:auto;background:var(--purple);position:relative;padding-bottom:74px}.top{height:54px;background:var(--deep);color:var(--cream);display:flex;align-items:center;justify-content:center;border-bottom:5px solid var(--ink);font-weight:bold}.sound{position:absolute;right:13px;top:11px;background:var(--cream);border:3px solid var(--ink);padding:5px 8px}.scene{min-height:350px;padding:18px;background:#3b2947 url("kami-lost-found.webp") center center / cover no-repeat;image-rendering:pixelated;border-bottom:5px solid var(--ink)}.window{height:115px;width:145px;margin:0 auto 15px;background:#2a203d;border:7px solid #3b2947;box-shadow:inset 0 0 0 3px #b28bb2;position:relative}.moon{width:38px;height:38px;border-radius:50%;background:var(--cream);position:absolute;right:18px;top:16px}.moon:after{content:'';width:31px;height:31px;border-radius:50%;background:#2a203d;position:absolute;left:10px;top:-4px}.cat{position:absolute;left:24px;bottom:0;width:43px;height:52px;background:#17131b;border-radius:45% 45% 20% 20%}.cat:before,.cat:after{content:'';position:absolute;top:-11px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:18px solid #17131b}.cat:before{left:0}.cat:after{right:0}.shelf{height:76px;border:6px solid var(--deep);background:#9d718e;display:flex;align-items:end;justify-content:center;gap:12px;padding:8px}.bottle{width:23px;border:4px solid var(--ink);background:var(--pink);height:39px}.bottle:nth-child(2){height:52px;background:#b89aca}.bottle:nth-child(3){height:34px;background:#d8b7a5}.crystal{width:55px;height:55px;border-radius:50%;background:#c6a7cf;border:5px solid var(--ink);margin:-10px auto 5px;box-shadow:0 9px 0 #4d3657}.panel{background:var(--cream);border:5px solid var(--ink);margin:14px;padding:14px;box-shadow:6px 6px 0 #3c2945}.panel h2{text-align:center;margin:2px 0 12px}.q,textarea{width:100%;border:4px solid var(--ink);background:#f7e8dc;padding:11px;font:inherit;color:var(--ink);resize:vertical}.q{min-height:44px}.deck{width:104px;height:146px;margin:18px auto;background:#412f50;border:7px double var(--cream);box-shadow:6px 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--cream);font-size:42px}.deck.cardface{width:190px;height:326px;padding:0;background:#17131b;overflow:hidden}.deck.cardface img.reversed{transform:rotate(180deg)}.deck.cardface img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}.btn{display:block;width:78%;margin:13px auto;background:var(--pink);border:5px solid var(--ink);box-shadow:4px 4px 0 var(--deep);padding:12px;font:700 16px monospace;color:var(--ink)}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--deep)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:70px;background:var(--deep);display:flex;border-top:5px solid var(--ink);z-index:5}.nav button{flex:1;background:none;border:0;color:var(--cream);font:bold 14px monospace}.nav button+button{border-left:3px solid #7e6089}.hidden{display:none}.cardtitle{text-align:center;font-size:19px}.orient{text-align:center;color:#6d4778}.records .item{border:4px solid var(--ink);background:#efd8c8;margin:10px 0;padding:10px}.tiny{font-size:12px;opacity:.75}.backup{display:flex;gap:8px}.backup .btn{width:50%;font-size:12px;margin:5px 0}.popup{position:fixed;inset:0;background:#1d1425bb;display:flex;align-items:center;justify-content:center;z-index:20}.popbox{width:min(330px,86vw);background:var(--cream);border:6px solid var(--ink);box-shadow:9px 9px 0 #6f4c79;padding:25px;text-align:center}.popbox b{font-size:23px}.pixelstars{text-align:center;color:#ead0df;letter-spacing:8px;margin:5px}.empty{text-align:center;padding:30px 5px}.file{display:none}

/* Unified underground lost-and-found styling — visual only */
:root{--ink:#22222e;--deep:#262633;--purple:#343441;--mauve:#75646b;--pink:#c7a49a;--cream:#d4b6a4}
body{background:#1c1c26;color:#292633}
.app{background:#30303c}
.top{background:#292934;color:#d8b2a2;border-bottom:3px solid #1c1d28;letter-spacing:.2px}
.sound{background:#d2afa0;border:3px solid #25232b;color:#26232c}
.scene{height:auto;min-height:0;aspect-ratio:888 / 855;padding:0;background:#262632 url("kami-lost-found.webp") center center / 100% 100% no-repeat;border-bottom:0;image-rendering:pixelated}
#home{background:#2c2b37;padding-bottom:18px}
#home .panel{background:#66565d;border:4px solid #26232e;box-shadow:none;margin:0 14px 14px;padding:18px 14px 20px;color:#e2b9aa;position:relative}
#home .panel h2{color:#e7bdad;font-size:19px;margin:4px 0 16px}
#home textarea{background:#dfbcab;border:4px solid #292734;color:#34303a;box-shadow:none;border-radius:0}
#home textarea::placeholder{color:#806e71}
#home .deck{background:#363341;border-color:#c8a69c;box-shadow:4px 4px 0 #26242f}
#home .btn{background:#bd9b91;color:#2a2832;border:4px solid #272630;box-shadow:4px 4px 0 #24232d}
.nav{background:#292834;border-top:4px solid #24222d}
.nav button{color:#d8b2a2}
.nav button+button{border-left:2px solid #4a414b}
/* Shared panels remain usable and legible throughout the app */
#result .panel,#records .panel{background:#d1b4a5;border-color:#292734;box-shadow:5px 5px 0 #22222c}
#result textarea,#records textarea{background:#ead1c3;border-color:#292734}
#result .btn,#records .btn{background:#c49e94;border-color:#292734;color:#292734;box-shadow:4px 4px 0 #292734}
.records .item{background:#e1c6b6;border-color:#292734}
.popbox{background:#d2b6a5;border-color:#292734;box-shadow:8px 8px 0 #292734}
@media(max-width:380px){#home .panel h2{font-size:17px}}


/* Keep save confirmation on a single line on mobile */
.popbox .save-confirm-line{font-size:clamp(11px,3.4vw,14px);white-space:nowrap;letter-spacing:-.06em;margin:12px -8px}

/* Worn lost-and-found handover stamp */
.popbox .handover-title{display:block;font-size:clamp(10px,2.9vw,12px);font-weight:700;white-space:nowrap;letter-spacing:-.075em;margin:2px -13px 0}
.popbox .handover-subtitle{font-size:14px;line-height:1.5;margin:12px 0 7px}
.popbox .paw-stamp{display:block;width:49px;height:49px;margin:2px auto 14px;transform:rotate(-9deg);opacity:.84;filter:contrast(.92)}

/* Home heading: centered, smaller and lighter */
#home .panel h2{font-size:14px;font-weight:500;line-height:1.6;letter-spacing:-.045em;text-align:center;word-break:keep-all;margin:4px 0 14px;}
</style></head><body><main class="app"><header class="top">✦ ༺ 마음 조각 분실물 센터 ༻ ✦<button id="sound" class="sound">♪</button></header>
<section id="home"><div class="scene"></div><div class="panel"><h2>카드를 뒤집어 소유자를 확인하시겠어요?</h2><textarea id="question" rows="3" placeholder="질문은 적어도 되고, 비워도 괜찮아요."></textarea><div id="deck" class="deck">☾</div><button id="draw" class="btn">카드 열기</button></div></section>
<section id="result" class="hidden"><div class="panel"><div class="deck cardface" id="face"><img id="cardimg" alt="뽑은 타로 카드"></div><h2 id="ct" class="cardtitle"></h2><div id="or" class="orient"></div><p id="meaning"></p><hr><p><b>이 카드를 보고 어떤 생각이 들었나요?</b></p><textarea id="reflection" rows="8" placeholder="마음에 떠오른 걸 자유롭게 적어주세요."></textarea><button id="save" class="btn">마음 찾아가기</button><button id="again" class="btn">한 장 더 뽑기</button></div></section>
<section id="records" class="hidden records"><div class="panel"><h2>마음 기록</h2><div id="list"></div><hr><div class="backup"><button id="export" class="btn">기록 백업하기</button><button id="importBtn" class="btn">기록 불러오기</button><input id="importFile" class="file" type="file" accept="application/json"></div><p class="tiny">백업 파일에는 질문·카드·정/역방향·기록·날짜가 함께 저장돼요.</p></div></section>
<nav class="nav"><button id="recordsNav">▣ 기록</button><button id="homeNav">⌂ 홈</button></nav></main>
<audio id="bgm" src="bgm.wav" loop></audio><audio id="rail" src="rail-ambience.wav" loop preload="auto"></audio><audio id="click" src="click.wav"></audio><audio id="flip" src="flip.wav"></audio>
<script>
let cards=[],current=null,soundOn=true,recentDraws=[];const $=s=>document.querySelector(s),bgm=$('#bgm'),rail=$('#rail'),click=$('#click'),flip=$('#flip');fetch('cards.json?v=20261012').then(r=>r.json()).then(x=>cards=x);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
function sfx(a){if(soundOn){a.currentTime=0;a.play().catch(()=>{})}}function clicky(){sfx(click)}document.addEventListener('pointerdown',e=>{if(e.target.closest('button')&&!e.target.matches('#draw'))clicky()});let bgmUnlocked=false;
function startBgm(){
  if(!soundOn||document.hidden)return;
  bgm.volume=.32;
  rail.volume=.13;
  // Start both audio elements directly inside the same user gesture.
  // Never gate rail playback on the BGM promise (mobile browser restriction).
  const musicPlay=bgm.play();
  const railPlay=rail.play();
  if(musicPlay)musicPlay.then(()=>{bgmUnlocked=true}).catch(()=>{});
  if(railPlay)railPlay.then(()=>{bgmUnlocked=true}).catch(()=>{});
}
startBgm();
function unlockSound(){if(soundOn&&(bgm.paused||rail.paused))startBgm()}
document.addEventListener('pointerdown',unlockSound,{passive:true});
document.addEventListener('touchstart',unlockSound,{passive:true});
document.addEventListener('keydown',unlockSound);
function stopBgm(){bgm.pause();rail.pause()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopBgm();else if(soundOn&&bgmUnlocked)startBgm()});
window.addEventListener('pagehide',stopBgm);
window.addEventListener('pageshow',()=>{if(soundOn&&bgmUnlocked)startBgm()});
$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'♪':'×';if(soundOn)startBgm();else stopBgm()};
function cardCode(name){const major=['The Fool','The Magician','The High Priestess','The Empress','The Emperor','The Hierophant','The Lovers','The Chariot','Strength','The Hermit','Wheel of Fortune','Justice','The Hanged Man','Death','Temperance','The Devil','The Tower','The Star','The Moon','The Sun','Judgement','The World'];let i=major.indexOf(name);if(i>=0)return 'ar'+String(i).padStart(2,'0');const suits={Wands:'wa',Cups:'cu',Swords:'sw',Pentacles:'pe'};for(const [suit,prefix] of Object.entries(suits)){if(name.endsWith(' of '+suit)){const rank=name.slice(0,-(' of '+suit).length),ranks={Ace:1,Two:2,Three:3,Four:4,Five:5,Six:6,Seven:7,Eight:8,Nine:9,Ten:10,Page:11,Knight:12,Queen:13,King:14};return prefix+String(ranks[rank]).padStart(2,'0')}}return 'ar00'}
function show(id){['home','result','records'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));if(id==='records')render()}
$('#draw').onclick=()=>{if(!cards.length)return;sfx(click);setTimeout(()=>sfx(flip),90);let pool=cards.filter(x=>!recentDraws.includes(x.en));if(!pool.length){recentDraws=[];pool=cards}let c=pool[Math.floor(Math.random()*pool.length)],rev=Math.random()<.5;recentDraws.push(c.en);if(recentDraws.length>8)recentDraws.shift();current={...c,rev,q:$('#question').value.trim()};$('#ct').textContent=c.en+' · '+c.ko;$('#or').textContent=rev?'역방향 REVERSED':'정방향 UPRIGHT';$('#meaning').textContent=(rev?c.r:c.u);const code=cardCode(c.en);const img=$('#cardimg');img.style.display='block';img.alt='';img.classList.toggle('reversed',rev);let sources=['https://raw.githubusercontent.com/sixseeds/tarot-api/main/cards/'+code+'.jpg','https://cdn.jsdelivr.net/gh/sixseeds/tarot-api@main/cards/'+code+'.jpg','https://petaloverflow.github.io/tarot-api/cards/'+code+'.jpg'];let si=0;img.onerror=()=>{si++;if(si<sources.length){img.src=sources[si]}else{img.onerror=null;img.style.display='none'}};img.src=sources[0];$('#face').style.transform='none';$('#reflection').value='';show('result')};
$('#save').onclick=()=>{if(!current)return;let arr=JSON.parse(localStorage.getItem('boriRecords')||'[]');arr.unshift({...current,text:$('#reflection').value,at:new Date().toISOString()});localStorage.setItem('boriRecords',JSON.stringify(arr));let p=document.createElement('div');p.className='popup';p.innerHTML='<div class="popbox"><b class="handover-title">해당 마음의 소유자가 확인되었습니다.</b><p class="handover-subtitle">정상적으로 인계합니다.</p><svg class="paw-stamp" viewBox="0 0 72 72" aria-label="낡은 붉은 고양이 발자국 도장" role="img" xmlns="http://www.w3.org/2000/svg"><defs><mask id="worn-paw"><rect width="72" height="72" fill="white"/><path d="M15 21l3 2-1 3-4-1zm42 28 3-2 1 4-3 2zM30 8l3 2-1 4-3-1zM47 59l4-2 1 2-3 3zM18 48l4-2 1 2-3 3zM38 34l2 1-1 2-2-1zM33 49l3-1 1 2-3 1zM49 26l2-2 2 2-2 2z" fill="black"/><path d="M11 38h5m40-2h4M25 61l4-1" stroke="black" stroke-width="2"/></mask></defs><g fill="none" stroke="#9f3435" stroke-width="2.9" stroke-linecap="round" mask="url(#worn-paw)"><path d="M57 18C47 7 27 7 17 17 6 28 7 47 19 57c10 9 28 8 39-3 10-10 10-26 2-36"/></g><g fill="#a33839" mask="url(#worn-paw)"><ellipse cx="22" cy="30" rx="5" ry="7" transform="rotate(-25 22 30)"/><ellipse cx="32" cy="23" rx="4.6" ry="6.5" transform="rotate(-8 32 23)"/><ellipse cx="44" cy="24" rx="4.6" ry="6.5" transform="rotate(12 44 24)"/><ellipse cx="53" cy="33" rx="4.6" ry="6.4" transform="rotate(29 53 33)"/><path d="M28 40c2-4 4-6 8-6s7 3 9 7c2 3 7 6 6 11-1 5-6 6-10 4-3-1-7-1-10 0-5 2-10-1-10-6 0-4 5-7 7-10z"/></g></svg><button class="btn">확인</button></div>';document.body.append(p);p.querySelector('button').onclick=()=>{clicky();p.remove();show('home')}};
$('#again').onclick=()=>show('home');$('#homeNav').onclick=()=>show('home');$('#recordsNav').onclick=()=>show('records');
function render(){let a=JSON.parse(localStorage.getItem('boriRecords')||'[]'),l=$('#list');if(!a.length){l.innerHTML='<div class="empty">아직 보관된 마음이 없어요.</div>';return}l.innerHTML=a.map(x=>`<div class="item"><b>${new Date(x.at).toLocaleString('ko-KR')}</b><br>${x.en} · ${x.ko} / ${x.rev?'역방향':'정방향'}${x.q?`<p>Q. ${esc(x.q)}</p>`:''}<p>${esc(x.text||'')}</p></div>`).join('')}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#export').onclick=()=>{let data=localStorage.getItem('boriRecords')||'[]',blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='보리의마음상점_백업.json';a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let t=await e.target.files[0].text(),j=JSON.parse(t);if(!Array.isArray(j))throw 0;localStorage.setItem('boriRecords',JSON.stringify(j));render();alert('기록을 불러왔어요.')}catch{alert('올바른 백업 파일이 아니에요.')}};
</script></body></html>
